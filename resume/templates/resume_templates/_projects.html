<section class="resume-section" data-section>
    {% include "resume_templates/_section_head.html" with title="PROJECTS & PUBLICATIONS" %}
    {% for project in project_data %}
    <div class="project-item" data-item>
        <span class="project-name">{{ project.name }}.</span>
        <span class="project-description">{{ project.description }}</span>
        {% if project.link %}<span class="project-link">{{ project.link }}</span>{% endif %}
    </div>
    {% endfor %}
</section>
