{# Header link to the pricing page: "Upgrade" on the free plan, a "Pro" badge on Pro. #}
{% if request.user.profile.is_pro %}
<a href="{% url 'resume:pricing' %}" class="px-2.5 py-1 rounded-full text-xs font-bold bg-green-50 text-green-700 border border-green-200 hover:bg-green-100 transition-colors" title="{{ UI.pricing_title }}">Pro</a>
{% else %}
<a href="{% url 'resume:pricing' %}" class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-primary/10 text-primary hover:bg-primary/20 transition-colors">
    <span class="material-symbols-outlined !text-[14px]">workspace_premium</span>{{ UI.nav_upgrade }}
</a>
{% endif %}
